name: condition demo

on:
  push:

jobs:
  say-hello:
    runs-on: ubuntu-latest

    steps:
      - name: main branch
        if: github.ref_name == 'main'
        run: echo "this one executes if branch is main"

      - name: future branch
        if: github.ref_name == 'future'
        run: echo "this one executes if branch is future"
